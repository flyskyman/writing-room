name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
      # 复制 → 翻译 → vet/test（日文原样 src/ 与翻译副本 run/build/src/）→ build
      - run: sh tools/rebuild.sh --no-restart
